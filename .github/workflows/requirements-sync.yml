name: Requirements sync

on:
  pull_request:
    paths:
      - ".github/requirements/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-sync:
    name: Verify requirements .txt match .in
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Recompile requirements and check for drift
        working-directory: .github/requirements
        run: |
          set -euo pipefail
          shopt -s nullglob
          for in_file in *.in; do
            uv pip compile "$in_file" --universal --generate-hashes --no-annotate -o "${in_file%.in}.txt"
          done
          git add --intent-to-add .
          if ! git diff --exit-code -- .; then
            echo "::error::Compiled requirements (*.txt) are out of sync with their *.in sources."
            echo "Regenerate with: uv pip compile <name>.in --universal --generate-hashes --no-annotate -o <name>.txt"
            exit 1
          fi
