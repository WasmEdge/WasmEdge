name: Build on Fedora

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      release:
        type: boolean
      upload_asset_url:
        type: string

permissions:
  contents: read

jobs:
  build_fedora:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora Rawhide
            image: fedora:rawhide
            asset_postfix: fedora-rawhide
          - name: Fedora Latest
            image: fedora:latest
            asset_postfix: fedora
    permissions:
      contents: write
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --privileged
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Install dependency
        run: |
          dnf update -y
          dnf install -y cmake ninja-build llvm llvm-devel lld-devel clang git file rpm-build dpkg-dev spdlog-devel \
            pkgconf-pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.10.0"
      - name: Start sccache server
        run: |
          for i in 1 2 3 4 5; do
            if sccache --start-server; then
              exit 0
            fi
            echo "sccache server failed to start (attempt ${i}/5); retrying..." >&2
            sleep $((i * 3))
          done
          echo "::warning::sccache server did not start; building without the compiler cache"
          echo "CMAKE_C_COMPILER_LAUNCHER=" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=" >> "$GITHUB_ENV"
      - name: Grant the safe directory for git
        run: |
          git config --global --add safe.directory $(pwd)
      - name: Build WasmEdge
        run: |
          cmake -Bbuild -GNinja -DCMAKE_BUILD_TYPE=Release -DWASMEDGE_BUILD_TESTS=ON -DWASMEDGE_BUILD_PACKAGE="TGZ;DEB;RPM" .
          cmake --build build
      - name: Test WasmEdge
        run: |
          export LD_LIBRARY_PATH="$(pwd)/build/lib/api:$LD_LIBRARY_PATH"
          cd build
          ./tools/wasmedge/wasmedge -v
          ctest
          cd -
      - name: Create package tarball
        run: |
          cmake --build build --target package
      - name: Upload artifact
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WasmEdge-${{ inputs.version }}-${{ matrix.asset_postfix }}.tar.gz
          path: build/WasmEdge-${{ inputs.version }}-Linux.tar.gz
