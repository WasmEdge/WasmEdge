name: Build on MacOS (static lib)

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      release:
        type: boolean

permissions:
  contents: read

jobs:
  build_on_macos_static:
    permissions:
      contents: write
    name: MacOS 15 (arm64, static lib)
    runs-on: macos-15
    env:
      BUILD_TYPE: Release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ensure git safe directory
        run: |
          git config --global --add safe.directory $(pwd)
      - name: Install Homebrew tools
        run: |
          brew install cmake llvm ninja zstd
      - name: Ensure static zstd
        run: |
          ZSTD_PREFIX="$(brew --prefix zstd)"
          if [ ! -f "${ZSTD_PREFIX}/lib/libzstd.a" ]; then
            ZSTD_SOURCE="$(mktemp -d)"
            curl -L --fail --retry 3 https://github.com/facebook/zstd/archive/refs/tags/v1.5.7.tar.gz -o "${ZSTD_SOURCE}/zstd.tar.gz"
            echo "37d7284556b20954e56e1ca85b80226768902e2edabd3b649e9e72c0c9012ee3  ${ZSTD_SOURCE}/zstd.tar.gz" | shasum -a 256 -c -
            tar -xzf "${ZSTD_SOURCE}/zstd.tar.gz" -C "${ZSTD_SOURCE}"
            cmake -S "${ZSTD_SOURCE}/zstd-1.5.7/build/cmake" -B "${ZSTD_SOURCE}/build" -GNinja \
              -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_SHARED=OFF -DZSTD_BUILD_PROGRAMS=OFF
            cmake --build "${ZSTD_SOURCE}/build" --target libzstd_static
            cp "${ZSTD_SOURCE}/build/lib/libzstd.a" "${ZSTD_PREFIX}/lib/libzstd.a"
            rm -rf "${ZSTD_SOURCE}"
          fi
          test -f "${ZSTD_PREFIX}/lib/libzstd.a"
      - name: Build WasmEdge (static lib)
        run: |
          export CC=clang
          export CXX=clang++
          rm -rf build output
          mkdir -p output
          cmake -Bbuild -GNinja -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DLLVM_DIR:PATH="$(brew --prefix)/opt/llvm/lib/cmake/llvm" \
            -DWASMEDGE_BUILD_STATIC_LIB=ON \
            -DWASMEDGE_BUILD_SHARED_LIB=OFF \
            -DWASMEDGE_LINK_LLVM_STATIC=ON \
            -DWASMEDGE_BUILD_TOOLS=OFF \
            -DWASMEDGE_BUILD_TESTS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_spdlog=ON \
            -DWASMEDGE_BUILD_PACKAGE="TGZ" \
            -DCMAKE_INSTALL_PREFIX:PATH=$GITHUB_WORKSPACE/output .
          cmake -DWASMEDGE_SOURCE_DIR="$PWD" -DBUILD_DIR="$PWD/build" \
            -DEXPECTED_BACKENDS=AARCH64 \
            -P test/llvm/VerifyRelocationBackendConfig.cmake
          cmake --build build
      - name: Verify static archive contents
        run: |
          # libwasmedge.a should exist and be a Mach-O static archive
          ls -la build/lib/api/libwasmedge.a
          file build/lib/api/libwasmedge.a | grep -i "archive"
          # Headers should be installed too
          cmake --install build
          ls output/lib/libwasmedge.a
          ls output/include/wasmedge/wasmedge.h
          # No dylib should be produced
          if find build/lib/api -name "libwasmedge*.dylib" -type f | grep -q .; then
            echo "ERROR: dylib produced despite WASMEDGE_BUILD_SHARED_LIB=OFF"
            exit 1
          fi
          echo "Pass: static archive present, no dylib"
      - name: Create package tarball
        run: |
          cmake --build build --target package
      - name: Upload artifact
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WasmEdge-${{ inputs.version }}-darwin_arm64_static.tar.gz
          # Glob the CPack output — for non-release runs the cmake-derived version
          # (e.g. git-describe output like "0.17.0-48-g863aed95") may not match
          # `inputs.version`. Only one tarball is produced per run.
          path: build/WasmEdge-*-Darwin.tar.gz
      - name: Upload package tarball
        if: ${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv build/WasmEdge-${{ inputs.version }}-Darwin.tar.gz WasmEdge-${{ inputs.version }}-darwin_arm64_static.tar.gz
          gh release upload ${{ inputs.version }} WasmEdge-${{ inputs.version }}-darwin_arm64_static.tar.gz --clobber
