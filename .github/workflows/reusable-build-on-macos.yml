name: Build on MacOS

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      matrix: # [ { name, runner, darwin_version }, ... ]
        type: string
        required: true
      release:
        type: boolean

permissions:
  contents: read

jobs:
  build_on_macos:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_TESTS: ON
      BUILD_TYPE: Debug
      SCCACHE_GHA_ENABLED: "true"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.10.0"
      - name: Warm up sccache server
        run: |
          for i in 1 2 3 4 5; do
            if sccache --show-stats >/dev/null 2>&1; then
              sccache --show-stats
              exit 0
            fi
            echo "sccache server not ready (attempt ${i}/5); retrying..." >&2
            sleep $((i * 3))
          done
          echo "sccache server did not become ready; aborting before the long build" >&2
          exit 1
      - name: Ensure git safe directory
        run: |
          git config --global --add safe.directory $(pwd)
      - name: Install Homebrew tools
        run: |
          brew install cmake llvm ninja wabt zstd
      - name: Ensure static zstd
        run: |
          ZSTD_PREFIX="$(brew --prefix zstd)"
          if [ ! -f "${ZSTD_PREFIX}/lib/libzstd.a" ]; then
            ZSTD_SOURCE="$(mktemp -d)"
            curl -L --fail --retry 3 https://github.com/facebook/zstd/archive/refs/tags/v1.5.7.tar.gz -o "${ZSTD_SOURCE}/zstd.tar.gz"
            echo "37d7284556b20954e56e1ca85b80226768902e2edabd3b649e9e72c0c9012ee3  ${ZSTD_SOURCE}/zstd.tar.gz" | shasum -a 256 -c -
            tar -xzf "${ZSTD_SOURCE}/zstd.tar.gz" -C "${ZSTD_SOURCE}"
            cmake -S "${ZSTD_SOURCE}/zstd-1.5.7/build/cmake" -B "${ZSTD_SOURCE}/build" -GNinja \
              -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_SHARED=OFF -DZSTD_BUILD_PROGRAMS=OFF
            cmake --build "${ZSTD_SOURCE}/build" --target libzstd_static
            cp "${ZSTD_SOURCE}/build/lib/libzstd.a" "${ZSTD_PREFIX}/lib/libzstd.a"
            rm -rf "${ZSTD_SOURCE}"
          fi
          test -f "${ZSTD_PREFIX}/lib/libzstd.a"
      - name: Install grpc
        if: ${{ !inputs.release }}
        run: |
          brew install grpc
      - name: Set environment variables for release
        if: ${{ inputs.release }}
        run: |
          echo "BUILD_TESTS=OFF" | tee -a $GITHUB_ENV
          echo "BUILD_TYPE=Release" | tee -a $GITHUB_ENV
      - name: Build WasmEdge
        run: |
          export CC=clang
          export CXX=clang++
          rm -rf build output
          mkdir -p output
          if [[ "$BUILD_TESTS" == "ON" ]]; then
            EXPECTED_BACKENDS='X86_64;AARCH64;ARM;RISCV64;S390X'
          elif [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            EXPECTED_BACKENDS=X86_64
          else
            EXPECTED_BACKENDS=AARCH64
          fi
          cmake -Bbuild -GNinja -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DLLVM_DIR:PATH="$(brew --prefix)/opt/llvm/lib/cmake/llvm" \
            -DWASMEDGE_BUILD_TESTS=$BUILD_TESTS \
            -DWASMEDGE_LINK_LLVM_STATIC=ON \
            -DWASMEDGE_BUILD_PACKAGE="TGZ" \
            -DCMAKE_INSTALL_PREFIX:PATH=$GITHUB_WORKSPACE/output .
          cmake -DWASMEDGE_SOURCE_DIR="$PWD" -DBUILD_DIR="$PWD/build" \
            "-DEXPECTED_BACKENDS=$EXPECTED_BACKENDS" \
            -P test/llvm/VerifyRelocationBackendConfig.cmake
          cmake --build build
      - name: Test WasmEdge
        run: |
          export DYLD_LIBRARY_PATH="$(pwd)/build/lib/api:$DYLD_LIBRARY_PATH"
          cd build
          ctest --output-on-failure
      - name: Create package tarball
        run: |
          cmake --build build --target package
      - name: Test Standalone WasmEdge without LLVM
        run: |
          export DYLD_LIBRARY_PATH="$(pwd)/build/lib/api:$DYLD_LIBRARY_PATH"
          echo "otool -L ./build/tools/wasmedge/wasmedge:"
          otool -L ./build/tools/wasmedge/wasmedge
          echo "otool -L ./build/tools/wasmedge/wasmedgec:"
          otool -L ./build/tools/wasmedge/wasmedgec
          echo "otool -L ./build/lib/api/libwasmedge.dylib:"
          otool -L ./build/lib/api/libwasmedge.dylib
          if otool -L ./build/lib/api/libwasmedge.dylib | grep libLLVM; then echo "Fail: libLLVM shared library linked" && exit 1; else echo "Pass: libLLVM shared library not linked"; fi;

          echo "Generate fibonacci.wasm from fibonacci.wat"
          wat2wasm examples/wasm/fibonacci.wat -o examples/wasm/fibonacci.wasm
          echo "./build/tools/wasmedge/wasmedgec examples/wasm/fibonacci.wasm fib_c.dylib"
          ./build/tools/wasmedge/wasmedgec examples/wasm/fibonacci.wasm fib_c.dylib
          echo "./build/tools/wasmedge/wasmedge --run-mode=aot --reactor fib_c.dylib fib 20"
          ./build/tools/wasmedge/wasmedge --run-mode=aot --reactor fib_c.dylib fib 20
          echo "./build/tools/wasmedge/wasmedge compile examples/wasm/fibonacci.wasm fib_compile.dylib"
          ./build/tools/wasmedge/wasmedge compile examples/wasm/fibonacci.wasm fib_compile.dylib
          echo "./build/tools/wasmedge/wasmedge --run-mode=aot --reactor fib_compile.dylib fib 20"
          ./build/tools/wasmedge/wasmedge --run-mode=aot --reactor fib_compile.dylib fib 20
      - name: Check symbol exposure
        run: |
          bash .github/scripts/check_symbols.sh
      - name: Upload artifact
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WasmEdge-${{ inputs.version }}-darwin_${{ matrix.darwin_version }}_${{ matrix.arch }}.tar.gz
          path: build/WasmEdge-${{ inputs.version }}-Darwin.tar.gz
      - name: Upload package tarball
        if: ${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv build/WasmEdge-${{ inputs.version }}-Darwin.tar.gz WasmEdge-${{ inputs.version }}-darwin_${{ matrix.arch }}.tar.gz
          gh release upload ${{ inputs.version }} WasmEdge-${{ inputs.version }}-darwin_${{ matrix.arch }}.tar.gz --clobber
